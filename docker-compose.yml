services:
  assistant:
    build: .
    # Do not publish the container port to host when using nginx-proxy.
    # The proxy will route traffic to the container on the exposed port over the Docker network.
    expose:
      - "8000"
    environment:
      - PYTHONPATH=/app/src
      - REDIS_URL=redis://redis:6379/0
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - VIRTUAL_HOST=dev.ludekkvapil.cz
      - LETSENCRYPT_HOST=dev.ludekkvapil.cz
      - LETSENCRYPT_EMAIL=info@ludekkvapil.cz
      # The port your app listens on inside the container. Keep this in sync with your app/uvicorn config.
      - VIRTUAL_PORT=8000
      - VIRTUAL_PROTO=http
      - VIRTUAL_NETWORK=nginx-proxy
      - HTTPS_METHOD=noredirect
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./src:/app/src
      - ./tests:/app/tests
    restart: unless-stopped
    depends_on:
      - redis
      - chromadb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - nginx-proxy

