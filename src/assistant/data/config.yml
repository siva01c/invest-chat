category_actions:
  # Explicit message forwarding requests
  leave_message: "forward_message"
  provide_contact: "forward_message"

  # Employment and leadership inquiries - ask for details about role/team
  job_opportunity: "ask_details"
  team_leadership: "ask_details"
  technical_architecture: "ask_details"

  # Urgent issues - ask for technical details first
  cybersecurity_urgent: "ask_details"

