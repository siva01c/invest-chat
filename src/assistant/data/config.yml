# Email templates and text snippets
email_config:
  fallback_template: |
    Hello Luděk,

    A user has contacted you via the sales assistant:

    {chat_summary}

    Timestamp: {timestamp}
    Contact: {contact_info}
    Language: {language_name}

    Best regards,
    Your Sales Assistant Bot
  
  text_snippets:
    contact_info_prefix: "• User Contact: "
    session_info_prefix: "• Session Info: "
    conversation_note_multiple: "This is a summary of {count} chat interactions. The user confirmed sending this summary instead of the full conversation history."
    conversation_note_single: "This was the first message in the conversation."
    contact_warning: "\n⚠️  **NOTE:** User appears to want contact but didn't provide contact information.\n"
    no_summary_available: "No summary available"