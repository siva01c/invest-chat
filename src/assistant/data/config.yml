response_messages:
  greeting: "Welcome! How can I help you learn about Luděk's xperience and career background?"  # fallback
  greeting_english: "Hello! I'm here to help you understand Luděk Kvapil's capabilities and technical expertise. Whether you're looking for a senior developer, tech lead, or someone to drive technical initiatives, I can share how Luděk's experience makes him an ideal long-term team member."
  greeting_czech: "Ahoj! Jsem zde, abych vám pomohl pochopit Luďkovy vedoucí schopnosti a technické odbornosti. Ať už hledáte senior developera, tech leada, nebo někoho, kdo povede technické iniciativy, mohu vám říct, jak z Luďka dělají jeho zkušenosti ideálního dlouhodobého člena týmu."
  common_knowledge: "I'm focused on showcasing Luděk Kvapil's professional qualifications and potential for employment opportunities. Feel free to ask about his technical experience, team collaboration skills, or career achievements!"
  code: "While I don't write code, I can tell you about Luděk's extensive development experience and how he mentors teams, leads technical decisions, and drives code quality improvements!"
  clear_chat: "Conversation cleared. What would you like to know about Luděk's capabilities and career experience?"
  email_error: "I'm sorry, there was an issue forwarding your message. Please try again later."

# Employment inquiry detail questions
service_detail_questions:
  job_opportunity:
    english: "Excellent! Luděk is actively seeking long-term employment opportunities where he can lead technical initiatives and mentor teams. Could you tell me more about the role? For example: What's the team size? Are you looking for a senior developer, tech lead, or engineering manager? What technical challenges does your team face?"
    czech: "Výborně! Luděk aktivně hledá dlouhodobé zaměstnanecké příležitosti, kde může vést technické iniciativy a mentorovat týmy. Můžete mi říct více o pozici? Například: Jaká je velikost týmu? Hledáte senior developera, tech leada, nebo engineering managera? Jakým technickým výzvám váš tým čelí?"
  
  team_leadership:
    english: "Perfect! Luděk excels at leading development teams and driving technical excellence. What specific challenges does your team face? Are you looking for someone to mentor junior developers, improve code quality, or establish better development processes?"
    czech: "Perfektní! Luděk vyniká ve vedení vývojářských týmů a prosazování technické dokonalosti. Jakým konkrétním vedoucím výzvám váš tým čelí? Hledáte někoho, kdo by mentoroval junior developery, zlepšil kvalitu kódu, nebo zavedl lepší vývojářské procesy?"
  
  drupal:
    english: "Great! Luděk brings 13+ years of Drupal experience. Is this for a senior Drupal architect role, leading a Drupal team, or driving Drupal strategy? What's the scale of your Drupal operations and team size?"
    czech: "Skvěle! Luděk přináší více než 13 let vedoucích zkušeností s Drupalem. Je to pro pozici senior Drupal architekta, vedení Drupal týmu, nebo řízení Drupal strategie? Jaký je rozsah vašich Drupal operací a velikost týmu?"
  
  cybersecurity_urgent:
    english: "I understand this is an urgent security incident! Luděk can help you fix this immediately. To provide the best assistance, please share: 1) Your website domain/URL, 2) What technology/CMS is used (WordPress, Drupal, custom PHP, etc.), 3) **Your contact details (email/phone)** so he can reach you quickly."
    czech: "Chápu, že se jedná o naléhavý bezpečnostní incident! Luděk vám může okamžitě pomoci. Pro nejlepší pomoc prosím sdílejte: 1) Doménu/URL vašeho webu, 2) Jaká technologie/CMS je použita (WordPress, Drupal, vlastní PHP, atd.), 3) **Vaše kontaktní údaje (email/telefon)**, aby vás mohl rychle kontaktovat."
  
  cybersecurity:
    english: "I understand you need cybersecurity help. Luděk specializes in security audits, penetration testing, and fixing security issues. **Could you provide your contact details** so I can connect you with him directly? Or would you like me to send him a summary of your security needs?"
    czech: "Chápu, že potřebujete pomoc s kyberbezpečností. Luděk se specializuje na bezpečnostní audity, penetrační testování a opravy bezpečnostních problémů. **Můžete mi poskytnout vaše kontaktní údaje**, abych vás s ním mohl spojit přímo? Nebo chcete, abych mu poslal shrnutí vašich bezpečnostních potřeb?"
  
  ai:
    english: "AI solutions are exciting! To understand your needs better, could you tell me more? Are you looking to integrate chatbots, build custom AI applications, or implement RAG systems?"
    czech: "AI řešení jsou vzrušující! Pro lepší pochopení vašich potřeb, můžete mi říct více? Hledáte integraci chatbotů, vývoj vlastních AI aplikací, nebo implementaci RAG systémů?"
  
  aws:
    english: "AWS has many powerful services! To help you better, could you share more about your project? Are you looking for cloud migration, serverless applications, or infrastructure optimization?"
    czech: "AWS má mnoho výkonných služeb! Pro lepší pomoc, můžete sdílet více o vašem projektu? Hledáte cloudovou migraci, serverless aplikace, nebo optimalizaci infrastruktury?"
  
  services:
    english: "I'd love to help you find the right services! Could you tell me more about what you're looking for? What type of project or technical challenge do you need help with?"
    czech: "Rád vám pomůžu najít správné služby! Můžete mi říct více o tom, co hledáte? Jaký typ projektu nebo technické výzvy potřebujete vyřešit?"

