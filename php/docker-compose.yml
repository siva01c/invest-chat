version: '3.8'

services:
  php:
    image: php:8.2-fpm
    container_name: php_app
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html

  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "1555:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - php
