# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name _;
    
    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS server configuration
server {
    listen 443 ssl;
    server_name _;
    
    # SSL certificate configuration
    ssl_certificate /etc/letsencrypt/live/api.ludekkvapil.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ludekkvapil.cz/privkey.pem;
    
    # Enhanced SSL parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    
    # HSTS (optional but recommended) - enforce HTTPS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
    
    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Block access to FastAPI documentation endpoints
    location ~ ^/(docs|redoc|openapi.json) {
        return 403;
    }
    
    # Main location block proxying to FastAPI
    location / {
        proxy_pass http://0.0.0.0:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}